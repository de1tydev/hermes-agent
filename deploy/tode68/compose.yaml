name: hermes-tode68

x-hermes-gateway: &hermes-gateway
  image: tode/hermes-agent:tode68-20260831-profileiso8
  restart: unless-stopped
  network_mode: host
  stop_grace_period: 120s
  volumes:
    - /srv/hermes:/opt/data
  environment:
    HERMES_UID: "10000"
    HERMES_GID: "10000"
    PATH: /opt/data/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    GATEWAY_MULTIPLEX_PROFILES: "true"
    HERMES_PROFILE_ISOLATION_ENFORCED: "true"
    HERMES_PROFILE_ADMIN_USER_IDS: "cfgg8ef2"
    HERMES_PROFILE_SHARED_READ_ROOTS: /opt/data/shared-skills:/opt/data/bin
    HERMES_GATEWAY_LOCK_DIR: /opt/data/state/gateway-locks-primary
  command: ["gateway", "run"]
  healthcheck:
    test: ["CMD-SHELL", "pgrep -f 'gateway.*run' >/dev/null"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 60s
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  gateway-primary:
    <<: *hermes-gateway
    container_name: hermes-gateway-primary
    env_file:
      - /srv/hermes/.env

  gateway-secondary:
    <<: *hermes-gateway
    profiles: ["secondary"]
    container_name: hermes-gateway-secondary
    env_file:
      - /srv/hermes/gateway-secondary.env
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      PATH: /opt/data/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GATEWAY_MULTIPLEX_PROFILES: "true"
      HERMES_PROFILE_ISOLATION_ENFORCED: "true"
      HERMES_PROFILE_ADMIN_USER_IDS: "cfgg8ef2"
      HERMES_PROFILE_SHARED_READ_ROOTS: /opt/data/shared-skills:/opt/data/bin
      API_SERVER_PORT: "8643"
      HERMES_CONTAINER_SKIP_PROFILE_RECONCILE: "true"
      HERMES_ENV_OVERLAY: /opt/data/gateway-secondary.env
      HERMES_GATEWAY_LOCK_DIR: /opt/data/state/gateway-locks-secondary
      HERMES_GATEWAY_NO_SUPERVISE: "true"
      HERMES_GATEWAY_CRON_ENABLED: "false"
    command: ["gateway", "run", "--no-supervise"]
